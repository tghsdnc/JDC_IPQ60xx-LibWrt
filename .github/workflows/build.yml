name: LiBwrt Stable Auto Build - JDCloud Arthur

on:
  schedule:
    # 每周一检查，由脚本控制每两周真正执行一次
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "强制编译，即使版本没有变化"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: jdcloud-arthur-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check latest stable release
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          # 定时任务每周触发，但只在双周执行
          if [ "$EVENT_NAME" = "schedule" ]; then
            ANCHOR=$(date -u -d "2026-01-05" +%s)
            NOW=$(date -u +%s)
            WEEKS=$(( (NOW - ANCHOR) / 604800 ))

            if [ "$WEEKS" -lt 0 ] || [ $((WEEKS % 2)) -ne 0 ]; then
              echo "非双周检查日，跳过。"
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # 获取上游最新正式 Release
          TAG=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/LiBwrt/LibWrt/releases/latest \
              | jq -r '.tag_name')

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "获取上游版本失败"
            exit 1
          fi

          OLD=$(cat last-built-version.txt 2>/dev/null || true)

          echo "上游最新版本：$TAG"
          echo "上次成功版本：${OLD:-无}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "$OLD" = "$TAG" ] && [ "$FORCE" != "true" ]; then
            echo "版本没有变化，跳过编译。"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "需要编译。"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.check.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker system prune -af || true
          df -h

      - name: Install dependencies
        if: steps.check.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache cmake \
            cpio curl device-tree-compiler fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libelf-dev libglib2.0-dev \
            libgmp-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libreadline-dev libfuse-dev libssl-dev \
            libtool lrzsz genisoimage msmtp nano ninja-build \
            p7zip-full patch pkgconf python3 python3-pip \
            qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip wget xmlto xxd \
            zlib1g-dev

      - name: Clone LiBwrt stable release
        if: steps.check.outputs.build == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git clone \
            --depth 1 \
            --single-branch \
            --branch "$TAG" \
            https://github.com/LiBwrt/LibWrt.git libwrt

          echo "SOURCE_COMMIT=$(git -C libwrt rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install and update feeds
        if: steps.check.outputs.build == 'true'
        working-directory: libwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure firmware
        if: steps.check.outputs.build == 'true'
        working-directory: libwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y

          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-fs-ksmbd=y
          EOF

          make defconfig

          for pkg in kmod-inet-diag kmod-nft-tproxy kmod-tun kmod-fs-ksmbd; do
            grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config || {
              echo "$pkg 配置失败！"
              exit 1
            }
          done

          cp .config Arthur.config
          echo "以下内核模块已内置到固件："
          grep -E '^CONFIG_PACKAGE_kmod-(inet-diag|nft-tproxy|tun|fs-ksmbd)=y$' .config

      - name: Download packages
        if: steps.check.outputs.build == 'true'
        working-directory: libwrt
        run: |
          make download -j2

      - name: Compile firmware
        if: steps.check.outputs.build == 'true'
        working-directory: libwrt
        run: |
          make -j1 V=s

      - name: Collect firmware
        if: steps.check.outputs.build == 'true'
        run: |
          set -e

          rm -rf output
          mkdir -p output

          FIRMWARE_DIR="libwrt/bin/targets/qualcommax/ipq60xx"

          # 有什么固件就收集什么，不再强制要求特定文件
          find "$FIRMWARE_DIR" -maxdepth 1 -type f \
            -name '*jdcloud_re-ss-01*.bin' -exec cp {} output/ \;

          echo "最终发布文件："
          ls -lh output/

      - name: Upload firmware
        if: steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: JDCloud-Arthur-${{ steps.check.outputs.tag }}
          path: output/
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.check.outputs.build == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Arthur-${{ steps.check.outputs.tag }}
          name: JDCloud Arthur Firmware ${{ steps.check.outputs.tag }}
          body: |
            京东云亚瑟（JDC Arthur / RE-SS-01）自动编译固件。

            上游项目：LiBwrt/LibWrt
            上游版本：${{ steps.check.outputs.tag }}
            源码提交：${{ env.SOURCE_COMMIT }}

            设备平台：Qualcomm IPQ6000 / IPQ60XX
          files: |
            output/*
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true

      - name: Record successful version
        if: steps.check.outputs.build == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          echo "$TAG" > last-built-version.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last-built-version.txt
          git commit -m "chore: record successful build $TAG" || true
          git push
