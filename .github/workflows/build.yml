
name: LiBwrt Stable Auto Build - JDCloud Arthur

on:
  schedule:
    # 每周一检查，由脚本控制每两周真正执行一次
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "强制编译，即使版本没有变化"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: jdcloud-arthur-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check latest stable release
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          set -e

          # 定时任务每周触发，但只在双周执行
          if [ "$EVENT_NAME" = "schedule" ]; then
            ANCHOR=$(date -u -d "2026-01-05" +%s)
            NOW=$(date -u +%s)
            WEEKS=$(( (NOW - ANCHOR) / 604800 ))

            if [ "$WEEKS" -lt 0 ] || [ $((WEEKS % 2)) -ne 0 ]; then
              echo "非双周检查日，跳过。"
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # 获取上游最新正式 Release
          TAG=$(curl -fsSL \
            https://api.github.com/repos/LiBwrt/LibWrt/releases/latest \
            | jq -r '.tag_name')

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "获取上游版本失败"
            exit 1
          fi

          OLD=$(cat last-built-version.txt 2>/dev/null || true)

          echo "上游最新版本：$TAG"
          echo "上次成功版本：${OLD:-无}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "$OLD" = "$TAG" ] && [ "$FORCE" != "true" ]; then
            echo "版本没有变化，跳过编译。"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "需要编译。"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.check.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker system prune -af || true
          df -h

      - name: Install dependencies
        if: steps.check.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache cmake \
            cpio curl device-tree-compiler fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libelf-dev libglib2.0-dev \
            libgmp-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libreadline-dev libfuse-dev libssl-dev \
            libtool lrzsz genisoimage msmtp nano ninja-build \
            p7zip-full patch pkgconf python3 python3-pip \
            qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip wget xmlto xxd \
            zlib1g-dev

      - name: Clone LiBwrt stable release
        if: steps.check.outputs.build == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git clone \
            --depth 1 \
            --single-branch \
            --branch "$TAG" \
            https://github.com/LiBwrt/LibWrt.git libwrt

          echo "SOURCE_COMMIT=$(git -C libwrt rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install and update feeds
        if: steps.check.outputs.build == 'true'
        working-directory: libwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate JDCloud Arthur configuration
        if: steps.check.outputs.build == 'true'
        working-directory: libwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y
          EOF

          make defconfig

          grep -q '^CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y' .config || {
            echo "设备配置检查失败！"
            exit 1
          }

          cp .config Arthur.config

      - name: Download packages
        if: steps.check.outputs.build == 'true'
        working-directory: libwrt
        run: |
          make download -j2

      - name: Compile firmware
        if: steps.check.outputs.build == 'true'
        working-directory: libwrt
        run: |
          make -j1 V=s

      - name: Collect firmware
        if: steps.check.outputs.build == 'true'
        run: |
          mkdir -p output

          find libwrt/bin/targets/qualcommax/ipq60xx \
            -type f \
            -exec cp -v {} output/ \;

          cp libwrt/Arthur.config output/Arthur.config
          echo "Release: ${{ steps.check.outputs.tag }}" > output/SOURCE.txt
          echo "Commit: $SOURCE_COMMIT" >> output/SOURCE.txt

          ls -lh output

      - name: Upload firmware
        if: steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: JDCloud-Arthur-${{ steps.check.outputs.tag }}
          path: output/
          retention-days: 30
          if-no-files-found: error

      - name: Record successful version
        if: steps.check.outputs.build == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          echo "$TAG" > last-built-version.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last-built-version.txt
          git commit -m "chore: record successful build $TAG" || true
          git push
