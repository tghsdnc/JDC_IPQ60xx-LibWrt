
name: LiBwrt Stable Auto Build - JDCloud Arthur

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "强制编译，即使版本没有变化"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: jdcloud-arthur-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check latest stable release
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          set -e

          if [ "$EVENT_NAME" = "schedule" ]; then
            ANCHOR=$(date -u -d "2026-01-05" +%s)
            NOW=$(date -u +%s)
            WEEKS=$(( (NOW - ANCHOR) / 604800 ))

            if [ "$WEEKS" -lt 0 ] || [ $((WEEKS % 2)) -ne 0 ]; then
              echo "非双周检查日，跳过。"
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          TAG=$(curl -fsSL \
            https://api.github.com/repos/LiBwrt/LibWrt/releases/latest \
            | jq -r '.tag_name')

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "获取上游版本失败"
            exit 1
          fi

          OLD=$(cat last-built-version.txt 2>/dev/null || true)

          echo "上游版本：$TAG"
          echo "上次成功版本：${OLD:-无}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "$OLD" = "$TAG" ] && [ "$FORCE" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.check.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker system prune -af || true
          df -h

      - name: Install dependencies
        if: steps.check.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache cmake \
            cpio curl device-tree-compiler fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libelf-dev libglib2.0-dev \
            libgmp-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libreadline-dev libfuse-dev libssl-dev \
            libtool lrzsz genisoimage msmtp nano ninja-build \
            p7zip-full patch pkgconf python3 python3-pip \
            qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip wget xmlto xxd \
            zlib1g-dev

      - name: Clone LiBwrt stable release
        if: steps.check.outputs.build == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git clone \
            --depth 1 \
            --single-branch \
            --branch "$TAG" \
            https://github.com/LiBwrt/LibWrt.git libwrt

          echo "SOURCE_COMMIT=$(git -C libwrt rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Add OpenClash feed
        if: steps.check.outputs.build == 'true'
        working-directory: libwrt
        run: |
          set -e

          grep -q 'openclash' feeds.conf.default || \
            echo 'src-git openclash https://github.com/vernesong/OpenClash.git' >> feeds.conf.default

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          ./scripts/feeds install -p openclash luci-app-openclash

          test -d package/feeds/openclash/luci-app-openclash

      - name: Generate JDCloud Arthur configuration
        if: steps.check.outputs.build == 'true'
        working-directory: libwrt
        run: |
          set -e

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y

          # OpenClash
          CONFIG_PACKAGE_luci-app-openclash=y

          # TUN
          CONFIG_PACKAGE_kmod-tun=y

          # nftables transparent proxy
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-inet-diag=y

          # OpenClash runtime dependencies
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ruby=y
          CONFIG_PACKAGE_ruby-yaml=y
          CONFIG_PACKAGE_unzip=y
          EOF

          make defconfig

          echo "检查设备配置..."
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y' .config

          echo "检查 OpenClash..."
          grep -E '^CONFIG_PACKAGE_luci-app-openclash=' .config || true

          echo "检查 TUN..."
          grep -E '^CONFIG_PACKAGE_kmod-tun=' .config || true

          echo "检查 TProxy..."
          grep -E '^CONFIG_PACKAGE_kmod-nft-tproxy=' .config || true

          echo "检查内核 TUN 选项..."
          grep -E '^CONFIG_KERNEL_TUN=' .config || true

          cp .config Arthur.config

      - name: Verify required packages
        if: steps.check.outputs.build == 'true'
        working-directory: libwrt
        run: |
          set -e

          for pkg in \
            luci-app-openclash \
            kmod-tun \
            kmod-nft-tproxy \
            kmod-inet-diag
          do
            if ! grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "错误：${pkg} 没有成功进入固件配置"
              exit 1
            fi
          done

          echo "必要软件包已进入配置。"

      - name: Download packages
        if: steps.check.outputs.build == 'true'
        working-directory: libwrt
        run: |
          make download -j2

      - name: Compile firmware
        if: steps.check.outputs.build == 'true'
        working-directory: libwrt
        run: |
          make -j1 V=s

      - name: Verify build output
        if: steps.check.outputs.build == 'true'
        working-directory: libwrt
        run: |
          set -e

          FIRMWARE_DIR="bin/targets/qualcommax/ipq60xx"

          find "$FIRMWARE_DIR" -type f \
            \( -name '*jdcloud_re-ss-01*.bin' -o -name '*.manifest' \)

          grep -R 'luci-app-openclash' "$FIRMWARE_DIR" \
            --include='*.manifest' || true

      - name: Collect firmware
        if: steps.check.outputs.build == 'true'
        run: |
          set -e

          rm -rf output
          mkdir -p output

          FIRMWARE_DIR="libwrt/bin/targets/qualcommax/ipq60xx"

          FACTORY=$(find "$FIRMWARE_DIR" -maxdepth 1 -type f \
            -name '*jdcloud_re-ss-01-squashfs-factory.bin' | head -n 1)

          SYSUPGRADE=$(find "$FIRMWARE_DIR" -maxdepth 1 -type f \
            -name '*jdcloud_re-ss-01-squashfs-sysupgrade.bin' | head -n 1)

          if [ -z "$FACTORY" ] || [ -z "$SYSUPGRADE" ]; then
            echo "没有找到工厂固件或升级固件！"
            find "$FIRMWARE_DIR" -maxdepth 1 -type f -name '*.bin'
            exit 1
          fi

          cp "$FACTORY" output/
          cp "$SYSUPGRADE" output/

          cp libwrt/Arthur.config output/

          cp "$FIRMWARE_DIR"/*.manifest output/ 2>/dev/null || true

          echo "最终发布文件："
          ls -lh output/

      - name: Upload firmware
        if: steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: JDCloud-Arthur-${{ steps.check.outputs.tag }}
          path: output/
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.check.outputs.build == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Arthur-${{ steps.check.outputs.tag }}
          name: JDCloud Arthur Firmware ${{ steps.check.outputs.tag }}
          body: |
            京东云亚瑟 RE-SS-01 自动编译固件。

            上游：LiBwrt/LibWrt
            上游版本：${{ steps.check.outputs.tag }}
            源码提交：${{ env.SOURCE_COMMIT }}

            已配置：
            - OpenClash
            - TUN 内核支持
            - nftables TProxy
            - Qualcomm NSS
          files: |
            output/*
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true

      - name: Record successful version
        if: steps.check.outputs.build == 'true'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          echo "$TAG" > last-built-version.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add last-built-version.txt
          git commit -m "chore: record successful build $TAG" || true
          git push
