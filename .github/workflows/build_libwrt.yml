name: Build LiBwrt

on:
  # 手动触发构建
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
        type: boolean
        
  # 定时触发：每两周自动检测并编译 (UTC 16:00 运行，每 14 天一次)
  schedule:
    - cron: '0 16 */14 * *'

# 设置并发控制，避免重复触发浪费额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker rmi $(docker image ls -q) 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev \
            libgmp3-dev liblzo2-dev libncurses5-dev libssl-dev libtool lrzsz mkisofs nano ninja-build \
            p7zip p7zip-full patch pkg-config python3 python3-pip python3-ply python3-docutils qemu-utils \
            re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget \
            xmlto xxd zlib1g-dev
          sudo apt-get clean
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Clone Source Code
        run: |
          git clone --depth 1 https://github.com/LiBwrt/LibWrt.git openwrt
          cd openwrt
          echo "OPENWRT_PATH=$(pwd)" >> $GITHUB_ENV

      - name: Check Source Updates (Skip if no change for scheduled builds)
        if: github.event_name == 'schedule'
        id: check_update
        run: |
          cd ${{ env.OPENWRT_PATH }}
          # 获取最新远程提交的 hash 与上次比对（针对定时任务）
          # 如果源码在最近 14 天内有更新，则继续；若没有更新，可选择退出或继续
          # 此处默认拉取最新，如果希望严格判断，GitHub Actions 默认拉取的就是最新
          echo "Latest commit: $(git rev-parse HEAD)"

      - name: Update Feeds
        run: |
          cd ${{ env.OPENWRT_PATH }}
          ./scripts/feeds update -a

      - name: Install Feeds
        run: |
          cd ${{ env.OPENWRT_PATH }}
          ./scripts/feeds install -a

      - name: Load Custom .config
        run: |
          if [ -f .config ]; then
            cp .config ${{ env.OPENWRT_PATH }}/.config
            echo "Found root .config and copied."
          elif [ -f config ]; then
            cp config ${{ env.OPENWRT_PATH }}/.config
            echo "Found root config and copied."
          else
            echo "Error: .config not found in repository root!"
            exit 1
          fi
          
          cd ${{ env.OPENWRT_PATH }}
          make defconfig

      - name: Download Package
        run: |
          cd ${{ env.OPENWRT_PATH }}
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Build Firmware
        run: |
          cd ${{ env.OPENWRT_PATH }}
          echo -e "$(nproc) thread build."
          make -j$(nproc) || make -j1 V=s

      - name: Organize Files
        id: organize
        if: (!cancelled())
        run: |
          cd ${{ env.OPENWRT_PATH }}/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$(pwd)" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Firmware to Artifact
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: LiBwrt-Firmware-${{ github.run_id }}
          path: ${{ env.FIRMWARE }}
