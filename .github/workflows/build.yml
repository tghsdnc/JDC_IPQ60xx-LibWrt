
name: LibWrt - JDCloud Arthur

on:
  workflow_dispatch:
    inputs:
      branch:
        description: LibWrt source branch
        required: true
        default: 25.12-nss
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker system prune -af || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-dev \
            python3-pip rsync unzip zlib1g-dev file wget curl \
            ccache libelf-dev libglib2.0-dev

      - name: Clone LibWrt
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git clone https://github.com/LiBwrt/LibWrt.git libwrt \
            -b "$BRANCH" --depth=1
          echo "SOURCE_COMMIT=$(git -C libwrt rev-parse HEAD)" >> $GITHUB_ENV

      - name: Configure Arthur
        working-directory: libwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-ss-01=y
          EOF

          make defconfig

          grep -E 'jdcloud_re-ss-01' .config || {
            echo "ERROR: Arthur device profile was not selected!"
            exit 1
          }

      - name: Download packages
        working-directory: libwrt
        run: make download -j2

      - name: Compile
        working-directory: libwrt
        run: make -j1 V=s

      - name: Collect firmware
        if: success()
        run: |
          mkdir -p output
          find libwrt/bin/targets/qualcommax/ipq60xx \
            -type f \
            \( -name '*jdcloud_re-ss-01*' \
            -o -name '*.manifest' \
            -o -name '*.buildinfo' \) \
            -exec cp -v {} output/ \;

          cp libwrt/.config output/Arthur.config
          echo "Commit: $SOURCE_COMMIT" > output/SOURCE.txt
          ls -lh output

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: LibWrt-Arthur-IPQ6000
          path: output/
          retention-days: 14
          if-no-files-found: error
